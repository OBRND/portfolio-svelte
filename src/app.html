<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/favicon.png?v=2" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#07080c" />
		<meta
			name="description"
			content="Obsan Diribsa — cross-platform mobile developer (Flutter) and web developer (SvelteKit). Shipped delivery, fintech and planning apps to production."
		/>

		<!--
			Theme is resolved before first paint so the page never flashes the wrong
			palette. The site is designed night-first, so night is what a new
			visitor gets; a choice made with the toggle is stored and wins from
			then on. Kept inline and synchronous on purpose: as a module it would
			run after first paint and reintroduce the flash.
		-->
		<script>
			(function () {
				var mode = 'dark';
				try {
					var stored = localStorage.getItem('theme');
					if (stored === 'light' || stored === 'dark') mode = stored;
				} catch (e) {}
				document.documentElement.classList.add(mode);
				document.documentElement.style.colorScheme = mode;
				// Gates the scroll-reveal styles and the intro curtain. Without JS
				// the class never lands, so that content renders plainly visible
				// instead of waiting for a script that will not run.
				document.documentElement.classList.add('js');
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
