<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/favicon.png?v=2" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Obsan Diribsa — cross-platform mobile developer (Flutter) and web developer (SvelteKit). Shipped delivery, fintech and planning apps to production."
		/>

		<!--
			Theme is resolved before first paint so the page never flashes the wrong
			palette. Stored choice wins; otherwise fall back to the OS preference.
			Kept inline and synchronous on purpose — moving this to a module would
			put it after first paint and reintroduce the flash.
		-->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var mode =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.classList.add(mode);
					document.documentElement.style.colorScheme = mode;
				} catch (e) {
					document.documentElement.classList.add('light');
				}
				// Gates the scroll-reveal styles. Without JS the class never lands,
				// so `[data-reveal]` content renders plainly visible instead of
				// waiting forever for an observer that will not run.
				document.documentElement.classList.add('js');
			})();
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
